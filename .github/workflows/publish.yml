name: Publish to npm

# npm trusted publishing (OIDC): no NPM_TOKEN secret. Configure the trusted publisher on
# npmjs.com for package dsh-work-components -> GitHub Actions, repository
# meya-ashuripehya/dsh-work-components, workflow publish.yml. Requires npm >= 11.5.1 and a
# public repository whose URL matches package.json "repository.url"; provenance is attached
# automatically.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10; trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm --version

      - run: npm ci

      # 桌面控制经纪人（自包含单文件 win-x64，约 73 MB）不进 git，发布前在这里构建并随 npm 包分发。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: npm run build:desktop -- --require

      # prepublishOnly runs build + check again during publish; doing it here fails earlier.
      - run: npm run build

      - run: npm run check

      # 预发布版本（含 "-"，如 0.4.0-beta.1）发到 beta 等 dist-tag，不移动 latest。
      - name: npm publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=$(echo "${VERSION#*-}" | cut -d. -f1) ;;
            *) TAG=latest ;;
          esac
          echo "publishing $VERSION with --tag $TAG"
          npm publish --access public --provenance --tag "$TAG"
