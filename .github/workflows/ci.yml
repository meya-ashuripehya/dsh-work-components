name: CI

# 上架清单：PR / push 证明可构建，并跑 check + smoke（真实调用 mm_send_image 等，不仅加载）。
# 发布仍由 publish.yml（tag v*）负责 desktop --require + npm publish。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 仍编译经纪人，确认目标能构建。这一份 Ubuntu tarball 使用无哈希模板，哈希绑定在 windows-checks。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: npm run build:desktop -- --require

      - run: npm run build

      - run: npm run check

      - run: npm run smoke

      # 验证与体积门禁用同一份 npm pack 结果。经纪人 exe 可以先构建，但不得出现在 tarball 里。
      - run: node scripts/pack-release.mjs --out artifacts

      - name: verify packed tarball
        run: node scripts/verify-package.mjs --tgz "$(tr -d '\r' < artifacts/tgz-path.txt)" --require-size

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: source manifest
        run: node scripts/verify-package.mjs --source

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 编译 exe，把同一次产物的哈希注入暂存清单，再校验 tarball。不上传 Release，不 npm publish。
      - name: compile desktop broker
        run: npm run build:desktop -- --require

      - name: build and verify the broker-bound tarball
        run: |
          npm run build
          node scripts/pack-release.mjs --out artifacts --broker-asset src/components/desktop/broker/dist/DSHDesktopBroker.exe
          $tgz = (Get-Content artifacts/tgz-path.txt -Raw).Trim()
          node scripts/verify-package.mjs --tgz $tgz --require-size --broker-asset src/components/desktop/broker/dist/DSHDesktopBroker.exe

      - name: integrity unit tests
        run: node --test src/update-integrity.test.mjs src/download-integrity.test.mjs src/plugin-compatibility.test.mjs src/components/desktop/broker-install.test.mjs src/settings-mask.test.mjs

      # 无交互桌面，不能把这一步叫成 UIA E2E。退出码 0 只表示报告已写出，状态是 not-run。
      - name: record host and UIA as not-run
        run: node scripts/verify-package.mjs --host | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 生产依赖的 critical 会失败。audit 计数为零也不是安全认证。
      - name: production audit
        run: npm audit --omit=dev --audit-level=critical

      - name: full audit report
        run: npm audit --json > audit-all.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: audit-all.json
          if-no-files-found: warn
