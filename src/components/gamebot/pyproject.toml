[project]
name = "trix-gamebot"
version = "0.1.0"
description = "独立通用游戏机器人服务：能力发现 + 语义动作 + 多驱动适配"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "websockets==12.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.0.0",
    "starlette==0.27.0",
    "anyio==3.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.1.2",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
]
vision = [
    "mss==10.1.0",
    "pyautogui==0.9.54",
    "pillow==10.3.0",
]

[project.scripts]
gamebot-mcp = "gamebot.mcp_bridge:main"

[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamebot*"]

[tool.setuptools.package-data]
gamebot = ["adapters/civilization/*.mjs", "adapters/civilization/mod/TRIXCompanion/*", "adapters/civilization/mod/TRIXCompanion/UI/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
